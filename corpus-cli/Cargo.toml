[package]
name = "corpus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

# The binary is what a user types; the crate directory keeps its internal
# name. Renamed 2026-08-21 — "corpus-cli" told an adopter nothing about what
# they had installed, and collides with any other corpus tool on PATH.
[[bin]]
name = "wikipethia"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
corpus-core = { version = "0.1.0", path = "../corpus-core" }
corpus-embed = { version = "0.1.0", path = "../corpus-embed" }
corpus-fetch = { version = "0.1.0", path = "../corpus-fetch" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.8"
