# The website: wikipethia.org, a static landing page served from disk by the
# same nginx that fronts the MCP endpoint (nginx-mcp.conf). Install as
# /etc/nginx/sites-available/wikipethia-site.conf and symlink into
# sites-enabled. The files are deploy/site/ in the repo, copied to
# /var/www/wikipethia.org by the runbook (deploy/README.md §6).
# Self-hosters: change wikipethia.org in both server_name lines and in the
# redirect target.
#
# Port 80 only, like nginx-mcp.conf. Run
#   certbot --nginx -d wikipethia.org -d www.wikipethia.org
# once both names resolve: it adds the 443 blocks, the certificate, and the
# HTTP→HTTPS redirect, under the renewal timer that already covers the
# endpoint's certificate.
#
# No rate limiting here: static files cost nginx nothing, and the zones in
# nginx-mcp.conf stay the endpoint's. No handlers of our own either. This is
# files on disk, which is what keeps it inside CLAUDE.md's scope.

server {
    # IPv4 only, for the reason nginx-mcp.conf gives; no AAAA record is published.
    listen 80;
    server_name wikipethia.org;

    root /var/www/wikipethia.org;
    index index.html;

    # The page loads nothing from anywhere else: inline styles, one script,
    # two images, system fonts. Pinned here rather than in a <meta> tag so a
    # copy of the HTML served elsewhere is not stuck with this policy.
    # `always` so error pages carry the headers too.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    # `expires`, not `add_header`: an add_header inside a location would
    # replace every header inherited from the server block above, and the
    # images would lose the security headers.
    location ~* \.png$ {
        expires 7d;
    }
}

server {
    listen 80;
    server_name www.wikipethia.org;

    # In a location, not at server level: a server-level `return` runs
    # before location matching, which would swallow certbot's ACME-challenge
    # location while the certificate is issued and renewed.
    location / {
        return 301 https://wikipethia.org$request_uri;
    }
}
