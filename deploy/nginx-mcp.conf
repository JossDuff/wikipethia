# The public edge: TLS + layered rate limiting in front of the loopback-bound
# MCP server. Install as /etc/nginx/sites-available/wikipethia-mcp.conf and
# symlink into sites-enabled — those files are included inside nginx's http
# block, which is why the zone/map directives below can live at the top of
# this file. Self-hosters: change mcp.wikipethia.org here AND in
# wikipethia-mcp.service (--allow-host) — rmcp validates the Host header
# against that list, so the two must match.
#
# This file is written for port 80 only. Run
#   certbot --nginx -d mcp.wikipethia.org
# once DNS resolves: it adds the 443 server block, the certificate, and the
# renewal timer (systemctl list-timers certbot).
#
# Rate limiting is layered, because the two abuse shapes are opposites:
# claude.ai and ChatGPT call from a handful of PLATFORM egress IPs carrying
# many users (per-IP must be high or two simultaneous users break each
# other), while a scraper is one IP pretending to be many sessions (per-
# session alone is no bound at all — session ids are client-chosen).
#   - per session: bounds one runaway agent, generous for real use
#   - per IP, high: bounds a single-IP scraper without pinching a platform
#     egress IP carrying dozens of concurrent sessions
#   - per-IP connection cap: bounds held-open SSE streams, which cost one
#     request each but hold a connection indefinitely

# The Mcp-Session-Id header identifies one client session; before the
# initialize handshake assigns one, fall back to the client IP.
map $http_mcp_session_id $wikipethia_session_key {
    ""      $binary_remote_addr;
    default $http_mcp_session_id;
}

limit_req_zone $wikipethia_session_key zone=wikipethia_session:10m rate=60r/m;
limit_req_zone $binary_remote_addr    zone=wikipethia_ip:10m      rate=600r/m;
limit_conn_zone $binary_remote_addr   zone=wikipethia_conn:10m;

server {
    # IPv4 only, deliberately: nginx keys IPv6 clients per /128, and anyone
    # with a routed /64 gets 2^64 rate-limit buckets. No AAAA record is
    # published; if one ever is, key the zones on the /64 prefix first.
    listen 80;
    server_name mcp.wikipethia.org;

    location / {
        limit_req zone=wikipethia_session burst=30 nodelay;
        limit_req zone=wikipethia_ip burst=300 nodelay;
        limit_conn wikipethia_conn 100;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8642;
        # rmcp checks Host against --allow-host; forward it unchanged.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP holds SSE streams open: no buffering, HTTP/1.1
        # keep-alive, and a read timeout the server's 15s SSE keepalives
        # continually reset.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
