# The public edge: TLS + per-IP rate limiting in front of the loopback-bound
# MCP server. Install as /etc/nginx/sites-available/wikipethia-mcp.conf and
# symlink into sites-enabled — those files are included inside nginx's http
# block, which is why the limit_req_zone below can live at the top of this
# file. Self-hosters: change mcp.wikipethia.org here AND in
# wikipethia-mcp.service (--allow-host) — rmcp validates the Host header
# against that list, so the two must match.
#
# This file is written for port 80 only. Run
#   certbot --nginx -d mcp.wikipethia.org
# once DNS resolves: it adds the 443 server block, the certificate, and the
# renewal timer (systemctl list-timers certbot).

# 30 requests/min per client IP — generous for a real agent session (the
# tools are sub-second reads), tight enough to bound a scraper. The burst
# absorbs an agent firing a handful of tool calls back-to-back.
limit_req_zone $binary_remote_addr zone=wikipethia_mcp:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.wikipethia.org;

    location / {
        limit_req zone=wikipethia_mcp burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8642;
        # rmcp checks Host against --allow-host; forward it unchanged.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP holds SSE streams open: no buffering, HTTP/1.1
        # keep-alive, and a read timeout long enough for a quiet session.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
