[workspace]
resolver = "3"
members = ["wikipethia-core", "wikipethia-embed", "wikipethia-fetch", "wikipethia-mcp", "wikipethia"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JossDuff/wikipethia"
description = "A curated local corpus of Ethereum research and standards, with hybrid search, exposed to LLM clients over MCP."
