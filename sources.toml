[[sources]]
# EELS — the executable execution-layer spec. `file_types = ["py"]` because
# the spec IS Python here, not markdown quoting Python.
#
# `branch = "default"` because this repo has NO stable branch to pin: no
# master/main, a `mainnet` branch that lags the tip by months, and a
# development branch named after the fork in progress (forks/amsterdam
# today). A fixed pin would go stale at every hard fork, silently — the old
# branch keeps existing, so sync would keep succeeding while learning
# nothing new. Tracking the default branch needs no maintenance; sync logs
# which branch that resolved to.
#
# paths is the whole of src/ethereum, which excludes tests/ (2,694 files)
# and packages/ — only ~24% of this repo's Python is spec.
#
# Wider than src/ethereum/forks because the per-fork modules call helpers
# that live beside them, and a spec function whose body names an identifier
# the corpus cannot resolve is a dead end for lookup_spec:
# `calculate_blob_gas_price` returns `taylor_exponential(...)`, which was in
# src/ethereum/utils/numeric.py and therefore invisible. Also brings in
# crypto/ (kzg, blake2, elliptic_curve — the precompiles) and the top-level
# state.py, merkle_patricia_trie.py, and exceptions.py, all of which the fork
# modules import constantly.
#
# Named as one directory rather than three because the files that matter most
# sit loose at the top of src/ethereum/ and `paths` entries are directory
# prefixes. `file_types = ["py"]` already drops assets/ and py.typed, so the
# broader prefix costs ~17 files against 1,028 already ingested. The tradeoff
# accepted: a new non-spec Python subtree under src/ethereum/ would be
# ingested silently, where the old narrow prefix would have excluded it.
id = "executionspecs"
kind = "repo"
url = "https://github.com/ethereum/execution-specs"
branch = "default"
paths = ["src/ethereum"]
file_types = ["py"]
doc_url = "https://github.com/ethereum/execution-specs/blob/HEAD/{path}"
tier = "spec"

[[sources]]
# The prose Engine API spec, one document per fork. src/eth/*.yaml (JSON-RPC
# method definitions) and the generated docs-api/*.mdx are excluded — the
# first needs YAML support we don't have, the second is JSX scaffolding.
id = "executionapis"
kind = "repo"
url = "https://github.com/ethereum/execution-apis"
branch = "main"
paths = ["src/engine"]
doc_url = "https://github.com/ethereum/execution-apis/blob/main/{path}"
tier = "spec"

[[sources]]
# AllCoreDevs notes — the record of what was decided and when. Tier
# "process": these are neither research nor spec, and lookup_spec (which
# filters tier == "spec") correctly ignores them.
#
# .github/ is excluded: 900+ bot-generated transcript artifacts, half the
# repo's files. Dates come from each note's own `Meeting Date/Time:` line;
# filenames carry no dates and the commit date moves on every later edit.
id = "pm"
kind = "repo"
url = "https://github.com/ethereum/pm"
branch = "master"
paths = [
  "AllCoreDevs-EL-Meetings",
  "AllCoreDevs-CL-Meetings",
  "Breakout-Room-Meetings",
  "Interop-Notes",
  "Network-Upgrade-Archive",
]
doc_url = "https://github.com/ethereum/pm/blob/master/{path}"
tier = "process"

