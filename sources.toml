# The manifest — source of truth for what is in the corpus (see CLAUDE.md).
# Adding a source of an existing kind is an edit here and nothing else:
#   corpus sync && corpus index && corpus embed
# …plus one documentation duty: update the Sources table in README.md.
#
# Curation policy (Joss, 2026-08-10): Ethereum-canonical sources only —
# the forums, the ethereum GitHub org, EF and vitalik's own writing.
# Research published by independent companies (however good) stays out;
# their incentives aren't the protocol's.
#
# id:   directory under data/ and the doc-id prefix — [a-z0-9_-], stable
#       forever (doc ids embed it).
# kind: which adapter fetches and parses it. "discourse" walks a forum;
#       "repo" snapshots a GitHub repository (tarball over HTTPS — the
#       ROADMAP's "git adapter", no git involved); "feed" walks an RSS feed
#       and fetches each article.
# url:  the forum/repo/feed URL, no trailing slash.
# tier: opaque source-quality label carried on every search result.
#
# repo kinds only:
#   branch:  branch to snapshot (also the commit-feed ref for file dates).
#   paths:   repo-relative directories whose .md files are indexed.
#   doc_url: canonical-URL template. {stem} = filename sans .md (doc ids
#            become "<id>/<stem>"); {path} = repo-relative path (doc ids
#            "<id>/<path sans .md>").

[[sources]]
id = "ethresearch"
kind = "discourse"
url = "https://ethresear.ch"
tier = "research"

[[sources]]
id = "ethmagicians"
kind = "discourse"
url = "https://ethereum-magicians.org"
tier = "standards"

[[sources]]
id = "eips"
kind = "repo"
url = "https://github.com/ethereum/EIPs"
branch = "master"
paths = ["EIPS"]
doc_url = "https://eips.ethereum.org/EIPS/{stem}"
tier = "spec"

[[sources]]
id = "ercs"
kind = "repo"
url = "https://github.com/ethereum/ERCs"
branch = "master"
paths = ["ERCS"]
doc_url = "https://ercs.ethereum.org/ERCS/{stem}"
tier = "spec"

[[sources]]
id = "consensusspecs"
kind = "repo"
url = "https://github.com/ethereum/consensus-specs"
branch = "master"
paths = ["specs"]
doc_url = "https://github.com/ethereum/consensus-specs/blob/master/{path}"
tier = "spec"

[[sources]]
# EELS — the executable execution-layer spec. `file_types = ["py"]` because
# the spec IS Python here, not markdown quoting Python.
#
# The branch is fork-named and there is NO stable alternative: this repo has
# no master/main, and its `mainnet` branch lags the tip by months. So the pin
# below goes stale every hard fork, and sync warns when it stops being the
# repo's default branch — when Amsterdam ships, update this line.
#
# paths excludes tests/ (2,694 files) and packages/ — only ~24% of this
# repo's Python is spec.
id = "executionspecs"
kind = "repo"
url = "https://github.com/ethereum/execution-specs"
branch = "forks/amsterdam"
paths = ["src/ethereum/forks"]
file_types = ["py"]
doc_url = "https://github.com/ethereum/execution-specs/blob/forks/amsterdam/{path}"
tier = "spec"

[[sources]]
# The prose Engine API spec, one document per fork. src/eth/*.yaml (JSON-RPC
# method definitions) and the generated docs-api/*.mdx are excluded — the
# first needs YAML support we don't have, the second is JSX scaffolding.
id = "executionapis"
kind = "repo"
url = "https://github.com/ethereum/execution-apis"
branch = "main"
paths = ["src/engine"]
doc_url = "https://github.com/ethereum/execution-apis/blob/main/{path}"
tier = "spec"

[[sources]]
# AllCoreDevs notes — the record of what was decided and when. Tier
# "process": these are neither research nor spec, and lookup_spec (which
# filters tier == "spec") correctly ignores them.
#
# .github/ is excluded: 900+ bot-generated transcript artifacts, half the
# repo's files. Dates come from each note's own `Meeting Date/Time:` line;
# filenames carry no dates and the commit date moves on every later edit.
id = "pm"
kind = "repo"
url = "https://github.com/ethereum/pm"
branch = "master"
paths = [
  "AllCoreDevs-EL-Meetings",
  "AllCoreDevs-CL-Meetings",
  "Breakout-Room-Meetings",
  "Interop-Notes",
  "Network-Upgrade-Archive",
]
doc_url = "https://github.com/ethereum/pm/blob/master/{path}"
tier = "process"

[[sources]]
id = "vitalik"
kind = "feed"
url = "https://vitalik.eth.limo/feed.xml"
tier = "blog"

[[sources]]
id = "efblog"
kind = "feed"
url = "https://blog.ethereum.org/en/feed.xml"
tier = "blog"
