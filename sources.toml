# The manifest — source of truth for what is in the corpus (see CLAUDE.md).
# Adding a source of an existing kind is an edit here and nothing else:
#   wikipethia sync && wikipethia index && wikipethia embed
# …plus one documentation duty: update BOTH README.md tables (Sources and
# Licensing) — CI counts their rows against this file.
#
# Curation policy: Ethereum-canonical sources only —
# the forums, the ethereum GitHub org, EF and vitalik's own writing.
# Research published by independent companies (however good) stays out;
# their incentives aren't the protocol's.
#
# id:   directory under data/ and the doc-id prefix — [a-z0-9_-], stable
#       forever (doc ids embed it).
# kind: which adapter fetches and parses it. "discourse" walks a forum;
#       "repo" snapshots a GitHub repository (tarball over HTTPS — the
#       ROADMAP's "git adapter", no git involved); "feed" walks an RSS feed
#       and fetches each article; "page" fetches one Markdown document.
# url:  the forum/repo/feed URL, no trailing slash. For a page, the
#       Markdown file itself.
# tier: opaque source-quality label carried on every search result.
#
# repo kinds only:
#   branch:  branch to snapshot (also the commit-feed ref for file dates).
#   paths:   repo-relative directories whose .md files are indexed.
#   doc_url: canonical-URL template. {stem} = filename sans .md (doc ids
#            become "<id>/<stem>"); {path} = repo-relative path (doc ids
#            "<id>/<path sans .md>").
#
# page kinds only:
#   doc_url:   the rendered page a citation links to. Its last path segment
#              names the document: the doc id is "<id>/<segment>".
#   published: the document's own date, as a quoted string: "YYYY-MM-DD".
#              Declared, because a page states its date in prose if at all,
#              and the file's last-commit date is when someone last fixed a
#              typo.
#
# A page is fetched ONCE. After that a sync makes no request for it; edit
# `url`, or run `wikipethia sync --force --source <id>`, to fetch it again.
# A page must also be the only page or crawled source on its host.
#   author:    optional byline.

[[sources]]
id = "ethresearch"
kind = "discourse"
url = "https://ethresear.ch"
tier = "research"

[[sources]]
id = "ethmagicians"
kind = "discourse"
url = "https://ethereum-magicians.org"
tier = "standards"

