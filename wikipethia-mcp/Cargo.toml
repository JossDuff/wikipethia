[package]
name = "wikipethia-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

# In stdio mode stdout is the MCP wire: a stray println! anywhere in this
# crate corrupts the protocol stream at runtime, silently. CI's clippy run
# (-D warnings) turns this into a build failure instead.
[lints.clippy]
print_stdout = "deny"

[dependencies]
anyhow = "1"
# Serves rmcp's tower Service in --http mode; deliberately minimal features
# (the same shape rmcp's own test suite uses). This is a transport, not the
# out-of-scope web frontend — no handlers or auth of our own.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
wikipethia-core = { version = "0.1.0", path = "../wikipethia-core" }
wikipethia-embed = { version = "0.1.0", path = "../wikipethia-embed" }
# 3.1.3 is a floor, not a preference. 3.0.0 answers `server/discover` by
# advertising `supportedVersions: [… "2026-07-28"]` and then cannot serve that
# protocol: Claude Code takes the advertisement at its word, drops the
# `initialize` handshake, sends `tools/list` with the version in `_meta`,
# rejects every reply and retries to exhaustion. The server ends up
# "connected" with **zero tools registered** — silently, which is what makes
# it dangerous (see agent-eval's `probe_tools_reachable`). Proven by rewriting
# only that one string in a proxy: drop "2026-07-28" from 3.0.0's advertised
# list and all five tools register.
rmcp = { version = "3.1.3", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "signal", "net"] }
# CancellationToken, wiring session shutdown and axum drain to one ctrl-c.
tokio-util = "0.7"
