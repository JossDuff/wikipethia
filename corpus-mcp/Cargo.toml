[package]
name = "corpus-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
corpus-core = { version = "0.1.0", path = "../corpus-core" }
corpus-embed = { version = "0.1.0", path = "../corpus-embed" }
rmcp = { version = "3.0.0", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
