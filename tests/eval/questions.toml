# The next three questions share one expected doc on purpose: the same
# target at three query distances — exact identifier, definitional phrase,
# and broad topical paraphrase. Note the metric consequence: 3 of the
# questions now ride on eip-4844 surfacing.

[[questions]]
# Lexical probe — also exercises the unhyphenated form ("EIP 4844").
question = "What is EIP 4844?"
# https://eips.ethereum.org/EIPS/eip-4844
expect = ["eips/eip-4844"]

[[questions]]
