# The retrieval eval set (see CLAUDE.md "Evals"). Each question is paired
# with the document ids that should surface in the top 10.
#
# Two ways to express what should surface:
#   `expect`     — all-of: every id is a separate credit.
#   `expect_any` — groups, each worth one credit earned by any single
#                  member; for questions several sources answer equally well.
#
# Ids are resolved mechanically from the cited URLs (a forum expect is the
# topic OP's document id). The staking-cap question's HackMD secondary
# source (fradamt's consolidation FAQ) stays out until HackMD is ingestible.

[[questions]]
question = "Why did Ethereum raise the staking cap for validators?"
# https://eips.ethereum.org/EIPS/eip-7251 (MAX_EFFECTIVE_BALANCE increase)
expect = ["eips/eip-7251"]

[[questions]]
question = "What is the current account abstraction flow on Ethereum?"
# Three credits, one per mechanism; each is earned by either the thread that
# argued it or the standard that specifies it.
# t/7160 ERC-4337 (vbuterin), t/19923 EIP-7702 (vbuterin), t/27617 EIP-8141
expect_any = [
    ["ethmagicians/post/21055", "ercs/erc-4337"],
    ["ethmagicians/post/48140", "eips/eip-7702"],
    ["ethmagicians/post/66767", "eips/eip-8141"],
]

