[[questions]]
question = "As of mid-2026, what is the next Ethereum hardfork and what are its proposed EIPs?"
# ADVERSARIAL TEMPORAL CASE (2026-08-11): the corpus actively misleads here —
# Hegotá (the fork AFTER next) has the newest, loudest planning threads, and
# its meta thread postdates Glamsterdam's. Recency and discussion volume both
# point at the wrong fork; the discriminator is Meta-EIP status, not date.
# This question beat the naive multi-hop approach in live testing. Date-pinned
# so the answer key never rots; expects are the Glamsterdam Meta EIP and
# timbeiko's meta thread.
